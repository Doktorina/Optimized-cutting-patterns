name: Build & Push Raskroy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  IMAGE_NAME: raskroy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GITEA_HOST }}
          username: ${{ secrets.GITEA_USER }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          # Секрет опционален: токен уже в .env.production репозитория
          build-args: |
            VITE_CUT_API_TOKEN=${{ secrets.VITE_CUT_API_TOKEN }}
          tags: |
            ${{ vars.GITEA_HOST }}/admin/${{ env.IMAGE_NAME }}:latest
            ${{ vars.GITEA_HOST }}/admin/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: true
