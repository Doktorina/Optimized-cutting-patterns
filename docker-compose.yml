# Деплой калькулятора раскроя на сервере.
# Перед запуском: docker login 192.168.48.150:3002
# Запуск:  docker compose up -d
# Логи:    docker compose logs -f
# Останов: docker compose down
services:
  raskroy:
    image: 192.168.48.150:3002/admin/raskroy:latest
    container_name: raskroy
    restart: unless-stopped
    ports:
      - "8084:80"