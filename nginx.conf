server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси сервиса расчёта (свой путь — не пересекается с другими проектами)
    location /cut-api/ {
        proxy_pass https://smartcut.pro/api/v1/;
        proxy_set_header Host smartcut.pro;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        client_max_body_size 4m;
    }

    # Кэш для статики (JS, CSS, шрифты, картинки)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Запрет на доступ к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
