# Сервер: /opt/raskroy/raskroy
# Registry: 192.168.48.150:3002/admin/raskroy:latest
# Порт хоста 8084 — не пересекается с другими контейнерами
services:
  raskroy:
    build:
      context: .
      args:
        VITE_CUT_API_TOKEN: ${VITE_CUT_API_TOKEN:-}
    image: 192.168.48.150:3002/admin/raskroy:latest
    container_name: raskroy
    restart: unless-stopped
    ports:
      - "8084:80"
