name: Deploy Raskroy

# Работает через self-hosted runner в той же сети, что и сервер 192.168.48.150
# (облачный GitHub runner до локального IP не достучится).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-raskroy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, raskroy]
    steps:
      - name: Deploy on server
        env:
          VITE_CUT_API_TOKEN: ${{ secrets.VITE_CUT_API_TOKEN }}
        run: |
          set -e
          cd /opt/raskroy/raskroy
          git pull

          docker build \
            --build-arg VITE_CUT_API_TOKEN="${VITE_CUT_API_TOKEN}" \
            -t 192.168.48.150:3002/admin/raskroy:latest \
            .

          docker compose up -d
