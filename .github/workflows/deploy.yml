name: Deploy Raskroy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-raskroy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: VITE_CUT_API_TOKEN
          script: |
            set -e
            cd /opt/raskroy/raskroy
            git pull

            docker build \
              --build-arg VITE_CUT_API_TOKEN="${VITE_CUT_API_TOKEN}" \
              -t 192.168.48.150:3002/admin/raskroy:latest \
              .

            docker compose up -d
        env:
          VITE_CUT_API_TOKEN: ${{ secrets.VITE_CUT_API_TOKEN }}
